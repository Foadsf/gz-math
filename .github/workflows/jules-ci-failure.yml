name: Jules on Windows CI failure

# Automatically asks Jules to investigate when the Windows CI job goes red.
#
# SCOPE IS DELIBERATELY NARROW. Two reasons:
#
#  1. Loop safety. Jules opens a PR, that PR runs Windows CI, and if it fails
#     the same trigger would fire again -- forever, burning the daily task
#     quota. The branch allowlist below is the guard: Jules names its branches
#     `<name>-<19-digit session id>`, which can never match an entry here, so a
#     Jules PR cannot re-trigger Jules. GitHub expressions have no regex, so an
#     explicit allowlist is the reliable way to express this.
#
#  2. Quota. A test that fails on every push would otherwise consume the whole
#     day's allowance in an afternoon.
#
# To let this react to another long-lived branch, add that branch to the
# allowlist in the `if:` below. Do NOT replace the allowlist with a pattern
# match unless you have re-established loop safety some other way.

on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]

# One investigation at a time per branch.
concurrency:
  group: jules-ci-failure-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  investigate:
    name: Ask Jules to investigate
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'workflow_dispatch' &&
      contains(fromJSON('["gz-math8", "main", "windows-ci"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Ground rules for this task — follow them exactly:
            1. EVIDENCE. For every factual claim, quote the exact line you relied on with its
               file path and line number, or the log line with its URL. If you cannot find it,
               write NOT FOUND.
            2. MEASURE AND JUDGE SEPARATELY. Report the measured value and your verdict as two
               distinct fields. Never let the verdict stand in for the measurement.
            3. DONE MEANS PROVEN. Do not report done until the CI run you depend on has
               CONCLUDED. Paste real output, not a description of it. Do not end your turn
               while a run you cited is still in progress.
            4. UNCERTAINTY. End with everything you could not verify. An empty list is itself
               a claim.
            5. NO ENVIRONMENT SCRIPTS IN THE DELIVERABLE. Do not commit tooling bootstrap
               files (installers, apt/curl setup scripts). They are not part of the change.

            ## What happened

            The Windows CI job failed on this repository.

            - Failed run: ${{ github.event.workflow_run.html_url }}
            - Branch:     ${{ github.event.workflow_run.head_branch }}
            - Commit:     ${{ github.event.workflow_run.head_sha }}

            ## Your environment, and what it means

            You run on Linux. This is a WINDOWS/MSVC failure. You cannot reproduce it
            locally, and you must not pretend otherwise. The only proof available to you is
            a real GitHub Actions run, which happens when you open a PR.

            Because of that, a careful diagnosis is worth more here than a fast patch.

            ## Task

            1. Read the failed run's logs and identify the failing step and the exact error.
            2. Decide whether it is a genuine regression in this repository, or an
               environment problem (a dependency moved, a runner image changed, a flake).
               Say which, with evidence. These need different responses and conflating them
               wastes everyone's time.
            3. If, and only if, it is a genuine regression with a clear cause: implement the
               minimal fix on a new branch, open a PR, WAIT for Windows CI to conclude on it,
               and paste the resulting ctest summary line.
            4. If the cause is not clear, or it looks environmental, DO NOT guess at a patch.
               Open no PR. Report the diagnosis, quote the evidence, and stop. A precise
               "here is what broke and why I cannot fix it blind" is a successful outcome.

            Never make CI green by disabling, skipping or excluding a test. If the honest
            answer is that the test now fails legitimately, say so and leave it failing.

            ## Reporting

            Report as data, separately from your verdict: the failing step, the verbatim
            error, the ctest summary line if the tests ran, and whether the cause is a
            regression or environmental. Then list what you could not verify.
